name: Pivot Job Alerts

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pivot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: Run Pivot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python -m pivot.main --config-dir config --log-level INFO

      - name: Upload Pivot debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pivot-debug-artifacts
          path: |
            data/last_run_candidates.json
            data/last_run_rejections.json
            data/last_run_source_health.json
            data/last_run_alerts.json
          if-no-files-found: warn
          retention-days: 14

      - name: Commit updated seen state
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/seen_jobs.json

          if git diff --cached --quiet; then
            echo "No seen state changes to commit."
          else
            git commit -m "Update seen jobs state"
            git push
          fi
