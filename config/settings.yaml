allow_internships: false
allow_unknown_visa: true
reject_us_citizenship_required: true
reject_security_clearance_required: true
location_country: US

alert_thresholds:
  target_company: 7
  curated_repo: 8
  unverified_source: 9
  rules_only_fallback: 9.0
  rule_only_fallback_alert_threshold: 9.0

gemini:
  enabled: true
  model: gemini-2.5-flash-lite
  max_jobs_per_run: 2
  min_rule_score_before_gemini: 5.0
  curated_min_rule_score_before_gemini: 5.0

email:
  smtp_host_env: SMTP_HOST
  smtp_port_env: SMTP_PORT
  smtp_username_env: SMTP_USERNAME
  smtp_password_env: SMTP_PASSWORD
  smtp_use_ssl_env: SMTP_USE_SSL
  from_env: ALERT_EMAIL_FROM
  to_env: ALERT_EMAIL_TO

debug:
  write_candidates: true
  write_rejections: true
  write_source_health: true



